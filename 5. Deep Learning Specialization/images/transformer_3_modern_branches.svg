<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="16"/>

  <text x="500" y="35" fill="#f8fafc" font-size="20" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">THE 3 DIVERGENT MODERN TRANSFORMER FAMILIES</text>
  <text x="500" y="60" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">How the 2017 Breakthrough Decoupled into Specialized Foundation Architectures</text>

  <!-- Root: Original Transformer -->
  <rect x="360" y="85" width="280" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="500" y="112" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">2017: Full Transformer (Enc-Dec)</text>

  <!-- Connecting Lines -->
  <line x1="500" y1="130" x2="500" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="180" y1="160" x2="820" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="180" y1="160" x2="180" y2="190" stroke="#38bdf8" stroke-width="2"/>
  <line x1="500" y1="160" x2="500" y2="190" stroke="#34d399" stroke-width="2"/>
  <line x1="820" y1="160" x2="820" y2="190" stroke="#c084fc" stroke-width="2"/>

  <!-- Branch 1: Encoder-Only (BERT) -->
  <rect x="50" y="190" width="260" height="230" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="50" y="190" width="260" height="35" rx="12" fill="#0284c7"/>
  <text x="180" y="213" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">ENCODER-ONLY (BERT)</text>
  <text x="65" y="245" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif">Focus: Comprehension (NLU)</text>
  <text x="65" y="270" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Bidirectional Attention</text>
  <text x="65" y="290" fill="#cbd5e1" font-size="11" font-family="sans-serif">  Tokens attend left &amp; right</text>
  <text x="65" y="315" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Masked LM (MLM):</text>
  <text x="75" y="335" fill="#94a3b8" font-size="10" font-family="sans-serif">"The [MASK] sat on mat"</text>
  <text x="65" y="365" fill="#fbbf24" font-size="11" font-weight="bold" font-family="sans-serif">Primary Industry Uses:</text>
  <text x="65" y="385" fill="#94a3b8" font-size="10" font-family="sans-serif">Google Search Ranking, Sentiment,</text>
  <text x="65" y="400" fill="#94a3b8" font-size="10" font-family="sans-serif">NER, Classification, Extractive QA</text>

  <!-- Branch 2: Decoder-Only (GPT) -->
  <rect x="370" y="190" width="260" height="230" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <rect x="370" y="190" width="260" height="35" rx="12" fill="#059669"/>
  <text x="500" y="213" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">DECODER-ONLY (GPT)</text>
  <text x="385" y="245" fill="#34d399" font-size="12" font-weight="bold" font-family="sans-serif">Focus: Generation (NLG)</text>
  <text x="385" y="270" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Causal Masked Attention</text>
  <text x="385" y="290" fill="#cbd5e1" font-size="11" font-family="sans-serif">  Tokens only look backwards</text>
  <text x="385" y="315" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Next-Token Prediction:</text>
  <text x="395" y="335" fill="#94a3b8" font-size="10" font-family="sans-serif">P(w_t | w_1, ..., w_{t-1})</text>
  <text x="385" y="365" fill="#fbbf24" font-size="11" font-weight="bold" font-family="sans-serif">Primary Industry Uses:</text>
  <text x="385" y="385" fill="#94a3b8" font-size="10" font-family="sans-serif">ChatGPT, Copilot, Creative Writing,</text>
  <text x="385" y="400" fill="#94a3b8" font-size="10" font-family="sans-serif">Autonomous AI Agents, Reasoning</text>

  <!-- Branch 3: Encoder-Decoder (T5 / BART) -->
  <rect x="690" y="190" width="260" height="230" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
  <rect x="690" y="190" width="260" height="35" rx="12" fill="#7c3aed"/>
  <text x="820" y="213" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">HYBRID (T5 / BART)</text>
  <text x="705" y="245" fill="#c084fc" font-size="12" font-weight="bold" font-family="sans-serif">Focus: Unified Text-to-Text</text>
  <text x="705" y="270" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Full Seq2Seq Restored</text>
  <text x="705" y="290" fill="#cbd5e1" font-size="11" font-family="sans-serif">  Bidirectional Enc + Causal Dec</text>
  <text x="705" y="315" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Multi-Task Text Paradigm:</text>
  <text x="715" y="335" fill="#94a3b8" font-size="10" font-family="sans-serif">"translate English to French: ..."</text>
  <text x="705" y="365" fill="#fbbf24" font-size="11" font-weight="bold" font-family="sans-serif">Primary Industry Uses:</text>
  <text x="705" y="385" fill="#94a3b8" font-size="10" font-family="sans-serif">Abstractive Summarization,</text>
  <text x="705" y="400" fill="#94a3b8" font-size="10" font-family="sans-serif">Machine Translation, Multi-Task</text>
</svg>