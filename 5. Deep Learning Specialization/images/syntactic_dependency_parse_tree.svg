<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="950" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="greenArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="16"/>

  <text x="475" y="35" fill="#f8fafc" font-size="18" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">SYNTACTIC DEPENDENCY PARSE TREE &amp; PART-OF-SPEECH (POS) TAGS</text>
  <text x="475" y="58" fill="#10b981" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Benchmark Visualization via spaCy displaCy (spacy.io)</text>

  <!-- Tokens and Positions -->
  <!-- Token X Centers:
       ROOT: 60
       I: 150
       saw: 240
       the: 340
       ship: 440
       with: 540
       very: 640
       Strong: 740
       binocular: 850
  -->

  <!-- Arcs -->
  <!-- ROOT -> saw -->
  <path d="M 60 170 C 60 100, 240 100, 240 170" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <rect x="130" y="88" width="45" height="20" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="152" y="102" fill="#10b981" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">ROOT</text>

  <!-- saw -> I (nsubj) -->
  <path d="M 240 170 C 240 120, 150 120, 150 170" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#greenArrow)"/>
  <rect x="175" y="128" width="42" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="196" y="141" fill="#10b981" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">nsubj</text>

  <!-- saw -> ship (dobj) -->
  <path d="M 240 170 C 240 100, 440 100, 440 170" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#greenArrow)"/>
  <rect x="320" y="98" width="38" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="339" y="111" fill="#10b981" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">dobj</text>

  <!-- ship -> the (dep / det) -->
  <path d="M 440 170 C 440 130, 340 130, 340 170" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#greenArrow)"/>
  <rect x="375" y="132" width="32" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="391" y="145" fill="#10b981" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">dep</text>

  <!-- saw -> with (prep) -->
  <path d="M 240 170 C 240 75, 540 75, 540 170" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <rect x="370" y="68" width="40" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="390" y="81" fill="#10b981" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">prep</text>

  <!-- with -> binocular (pobj) -->
  <path d="M 240 170 C 240 50, 850 50, 850 170" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <rect x="525" y="42" width="40" height="20" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="545" y="56" fill="#10b981" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">pobj</text>

  <!-- Strong -> very (advmod) -->
  <path d="M 740 170 C 740 130, 640 130, 640 170" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#greenArrow)"/>
  <rect x="668" y="130" width="48" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="692" y="143" fill="#10b981" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">advmod</text>

  <!-- binocular -> Strong (amod) -->
  <path d="M 850 170 C 850 120, 740 120, 740 170" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#greenArrow)"/>
  <rect x="774" y="122" width="42" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="795" y="135" fill="#10b981" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">amod</text>

  <!-- Token Boxes -->
  <!-- ROOT -->
  <rect x="25" y="180" width="70" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="60" y="206" fill="#f8fafc" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">ROOT</text>

  <!-- I -->
  <rect x="115" y="180" width="70" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="150" y="206" fill="#f8fafc" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">I</text>
  <line x1="150" y1="222" x2="150" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#greenArrow)"/>
  <text x="150" y="285" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">PP</text>
  <text x="150" y="305" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Pronoun</text>

  <!-- saw -->
  <rect x="205" y="180" width="70" height="42" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="240" y="206" fill="#38bdf8" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">saw</text>
  <line x1="240" y1="222" x2="240" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#greenArrow)"/>
  <text x="240" y="285" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">VBD</text>
  <text x="240" y="305" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Verb (Past)</text>

  <!-- the -->
  <rect x="305" y="180" width="70" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="340" y="206" fill="#f8fafc" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">the</text>
  <line x1="340" y1="222" x2="340" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#greenArrow)"/>
  <text x="340" y="285" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">DT</text>
  <text x="340" y="305" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Determiner</text>

  <!-- ship -->
  <rect x="405" y="180" width="70" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="440" y="206" fill="#f8fafc" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">ship</text>
  <line x1="440" y1="222" x2="440" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#greenArrow)"/>
  <text x="440" y="285" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">NN</text>
  <text x="440" y="305" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Noun</text>

  <!-- with -->
  <rect x="505" y="180" width="70" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="540" y="206" fill="#f8fafc" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">with</text>
  <line x1="540" y1="222" x2="540" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#greenArrow)"/>
  <text x="540" y="285" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">IN</text>
  <text x="540" y="305" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Preposition</text>

  <!-- very -->
  <rect x="605" y="180" width="70" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="640" y="206" fill="#f8fafc" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">very</text>
  <line x1="640" y1="222" x2="640" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#greenArrow)"/>
  <text x="640" y="285" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">RB</text>
  <text x="640" y="305" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Adverb</text>

  <!-- Strong -->
  <rect x="705" y="180" width="70" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="740" y="206" fill="#f8fafc" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">Strong</text>
  <line x1="740" y1="222" x2="740" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#greenArrow)"/>
  <text x="740" y="285" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">JJ</text>
  <text x="740" y="305" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Adjective</text>

  <!-- binocular -->
  <rect x="805" y="180" width="90" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="850" y="206" fill="#f8fafc" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">binocular</text>
  <line x1="850" y1="222" x2="850" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#greenArrow)"/>
  <text x="850" y="285" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">NN</text>
  <text x="850" y="305" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Noun</text>

  <!-- Bottom Annotation -->
  <text x="475" y="340" fill="#94a3b8" font-size="12" font-family="sans-serif" text-anchor="middle">PP-Attachment Solved: 'prep' arc attaches 'with' to verb 'saw', proving binoculars were the instrument of seeing.</text>
</svg>