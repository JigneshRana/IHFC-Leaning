<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="failGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="succGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="16"/>

  <text x="500" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">THE PARADIGM SHIFT: CASCADED NLP PIPELINES VS. TRANSFORMERS</text>

  <!-- TOP HALF: TRADITIONAL PIPELINE -->
  <rect x="40" y="65" width="920" height="190" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="40" y="65" width="920" height="30" rx="12" fill="#e11d48"/>
  <text x="500" y="86" fill="#ffffff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">TRADITIONAL CASCADED PIPELINE (Fragile &amp; Cascading Error Vulnerability)</text>

  <!-- Pipeline Steps -->
  <rect x="60" y="115" width="120" height="40" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="120" y="140" fill="#cbd5e1" font-size="12" font-family="sans-serif" text-anchor="middle">1. Tokenizer</text>

  <line x1="180" y1="135" x2="220" y2="135" stroke="#64748b" stroke-width="2"/>

  <rect x="220" y="115" width="130" height="40" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
  <text x="285" y="140" fill="#f43f5e" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">2. POS Tagger ❌</text>

  <line x1="350" y1="135" x2="390" y2="135" stroke="#f43f5e" stroke-width="2"/>

  <rect x="390" y="115" width="150" height="40" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
  <text x="465" y="140" fill="#f43f5e" font-size="12" font-family="sans-serif" text-anchor="middle">3. Dependency Parser ⚠️</text>

  <line x1="540" y1="135" x2="580" y2="135" stroke="#f43f5e" stroke-width="2"/>

  <rect x="580" y="115" width="150" height="40" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
  <text x="655" y="140" fill="#f43f5e" font-size="12" font-family="sans-serif" text-anchor="middle">4. Semantic Roles 💥</text>

  <line x1="730" y1="135" x2="770" y2="135" stroke="#f43f5e" stroke-width="2"/>

  <rect x="770" y="115" width="170" height="40" rx="6" fill="#9f1239" stroke="#f43f5e" stroke-width="2"/>
  <text x="855" y="140" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Final Task Fails!</text>

  <text x="60" y="185" fill="#f43f5e" font-size="12" font-weight="bold" font-family="sans-serif">The Cascading Error Trap:</text>
  <text x="60" y="205" fill="#94a3b8" font-size="11" font-family="sans-serif">If the POS tagger mislabels "saw" as a Noun (carpenter's tool) instead of a Verb (action),</text>
  <text x="60" y="225" fill="#94a3b8" font-size="11" font-family="sans-serif">the syntactic dependency parser builds an invalid noun-phrase tree, propagating catastrophic errors to semantic analysis.</text>


  <!-- BOTTOM HALF: TRANSFORMER ARCHITECTURE -->
  <rect x="40" y="280" width="920" height="190" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="40" y="280" width="920" height="30" rx="12" fill="#059669"/>
  <text x="500" y="301" fill="#ffffff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">MODERN DEEP TRANSFORMERS (End-to-End Hierarchical Representation Learning)</text>

  <rect x="60" y="330" width="140" height="45" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="130" y="357" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Raw Subwords (BPE)</text>

  <line x1="200" y1="352" x2="240" y2="352" stroke="#10b981" stroke-width="2"/>

  <rect x="240" y="325" width="200" height="55" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="340" y="347" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Layers 1 - 4 (Bottom)</text>
  <text x="340" y="367" fill="#a7f3d0" font-size="10" font-family="sans-serif" text-anchor="middle">Implicit Lexical &amp; POS Patterns</text>

  <line x1="440" y1="352" x2="480" y2="352" stroke="#10b981" stroke-width="2"/>

  <rect x="480" y="325" width="220" height="55" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="590" y="347" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Layers 5 - 8 (Middle)</text>
  <text x="590" y="367" fill="#a7f3d0" font-size="10" font-family="sans-serif" text-anchor="middle">Implicit Syntactic Dependency Parsing</text>

  <line x1="700" y1="352" x2="740" y2="352" stroke="#10b981" stroke-width="2"/>

  <rect x="740" y="325" width="200" height="55" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="840" y="347" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Layers 9 - 12+ (Top)</text>
  <text x="840" y="367" fill="#a7f3d0" font-size="10" font-family="sans-serif" text-anchor="middle">Implicit Semantics &amp; Context</text>

  <text x="60" y="415" fill="#10b981" font-size="12" font-weight="bold" font-family="sans-serif">The Transformer Advantage ("BERTology"):</text>
  <text x="60" y="435" fill="#94a3b8" font-size="11" font-family="sans-serif">Self-Attention automatically discovers word relationships end-to-end through self-supervised pre-training.</text>
  <text x="60" y="455" fill="#94a3b8" font-size="11" font-family="sans-serif">Zero pipeline fragility: Attention heads dynamically attend across all tokens without brittle step-by-step rules.</text>
</svg>