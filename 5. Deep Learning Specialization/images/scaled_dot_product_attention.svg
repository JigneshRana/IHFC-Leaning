<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="16"/>

  <text x="450" y="45" fill="#f8fafc" font-size="22" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">SCALED DOT-PRODUCT ATTENTION MECHANISM</text>
  <text x="450" y="72" fill="#38bdf8" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle">Attention(Q, K, V) = softmax( (Q Kᵀ) / √d_k ) V</text>

  <!-- Inputs Q, K, V -->
  <!-- Q Box -->
  <rect x="150" y="120" width="100" height="45" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="148" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Queries (Q)</text>

  <!-- K Box -->
  <rect x="300" y="120" width="100" height="45" rx="8" fill="#7c3aed" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="350" y="148" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Keys (K)</text>

  <!-- MatMul Q and K -->
  <line x1="200" y1="165" x2="260" y2="200" stroke="#38bdf8" stroke-width="2"/>
  <line x1="350" y1="165" x2="290" y2="200" stroke="#a78bfa" stroke-width="2"/>
  <rect x="210" y="200" width="130" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="275" y="225" fill="#f8fafc" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">MatMul (Q · Kᵀ)</text>

  <!-- Scale by sqrt(d_k) -->
  <line x1="275" y1="240" x2="275" y2="270" stroke="#38bdf8" stroke-width="2"/>
  <rect x="200" y="270" width="150" height="40" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="275" y="295" fill="#f59e0b" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Scale (÷ √d_k)</text>

  <!-- Optional Mask -->
  <line x1="275" y1="310" x2="275" y2="340" stroke="#38bdf8" stroke-width="2"/>
  <rect x="190" y="340" width="170" height="40" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="275" y="365" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">Mask (Optional / Causal)</text>

  <!-- Softmax -->
  <line x1="275" y1="380" x2="275" y2="410" stroke="#38bdf8" stroke-width="2"/>
  <rect x="210" y="410" width="130" height="40" rx="8" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
  <text x="275" y="435" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Softmax (Weights)</text>

  <!-- V Box -->
  <rect x="450" y="120" width="100" height="45" rx="8" fill="#059669" stroke="#34d399" stroke-width="1.5"/>
  <text x="500" y="148" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Values (V)</text>

  <!-- Final MatMul with V -->
  <line x1="275" y1="450" x2="380" y2="480" stroke="#fbbf24" stroke-width="2"/>
  <line x1="500" y1="165" x2="500" y2="460" stroke="#34d399" stroke-width="2"/>
  <line x1="500" y1="460" x2="420" y2="480" stroke="#34d399" stroke-width="2"/>

  <rect x="330" y="480" width="140" height="45" rx="8" fill="#047857" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="507" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Output Matrix</text>

  <!-- Right Side Explanations -->
  <rect x="580" y="120" width="280" height="390" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="150" fill="#38bdf8" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">Why √d_k Scaling Matters:</text>
  <text x="600" y="180" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">• For large d_k (e.g. 64), dot</text>
  <text x="600" y="200" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">  products grow large in magnitude.</text>
  <text x="600" y="225" fill="#f43f5e" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">• The Softmax Trap:</text>
  <text x="600" y="245" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">  Large inputs push Softmax into</text>
  <text x="600" y="265" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">  flat regions with near-zero</text>
  <text x="600" y="285" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">  gradients (training stalls).</text>
  <text x="600" y="315" fill="#10b981" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">• Division by √d_k:</text>
  <text x="600" y="335" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">  Preserves unit variance (Var = 1),</text>
  <text x="600" y="355" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">  enabling healthy backpropagation.</text>

  <line x1="600" y1="380" x2="840" y2="380" stroke="#334155" stroke-width="1"/>
  <text x="600" y="410" fill="#a78bfa" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">Multi-Head Extension:</text>
  <text x="600" y="435" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">Runs h=8 attention heads in parallel</text>
  <text x="600" y="455" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">across distinct representation subspaces.</text>
</svg>